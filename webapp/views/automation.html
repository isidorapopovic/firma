<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Automation Center</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="automation">
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="dot"></span>
                <span>Firma</span>
            </div>
            <nav class="nav">
                <a href="/" data-nav="home">Home</a>
                <a href="/overview" data-nav="overview">Overview</a>
                <a href="/kpi" data-nav="kpi">KPI</a>
                <a href="/transactions" data-nav="transactions">Transactions</a>
                <a href="/automation" data-nav="automation">Automation</a>
                <a href="/visualizations" data-nav="visualizations">Visualizations</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Automation Center</h1>
            <p>Create automations, enable/disable them, and delete them.</p>
        </section>

        <section class="panel split">
            <div>
                <h2>Automations</h2>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Schedule</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="autoTableBody"></tbody>
                </table>
            </div>

            <div>
                <h2>Add automation</h2>
                <form id="autoForm" class="form">
                    <div class="field">
                        <label for="autoName">Name</label>
                        <input id="autoName" placeholder="Monthly invoice reminder" required />
                    </div>

                    <div class="field">
                        <label for="autoSchedule">Schedule</label>
                        <input id="autoSchedule" placeholder="Every 1st day at 10:00" required />
                    </div>

                    <button class="btn" type="submit">Create</button>

                    <p class="note">
                        Later we’ll connect real jobs (cron/queue) + permissions + logs.
                    </p>
                </form>
            </div>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
