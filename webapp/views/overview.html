<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Business Overview</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="overview">
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="dot"></span>
                <span>Firma</span>
            </div>
            <nav class="nav">
                <a href="/" data-nav="home">Home</a>
                <a href="/overview" data-nav="overview">Overview</a>
                <a href="/kpi" data-nav="kpi">KPI</a>
                <a href="/transactions" data-nav="transactions">Transactions</a>
                <a href="/automation" data-nav="automation">Automation</a>
                <a href="/visualizations" data-nav="visualizations">Visualizations</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Business Overview</h1>
            <p>Live data from the backend API (in-memory for now).</p>
        </section>

        <section class="panel">
            <h2>Snapshot</h2>
            <div id="overviewStats" class="note">Loading…</div>
        </section>

        <section class="panel">
            <h2>Latest transactions</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="latestTransactions"></tbody>
            </table>
        </section>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
